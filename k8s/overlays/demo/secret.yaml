# ⚠️ DEMO/THROWAWAY secrets — giá trị dummy, KHÔNG dùng production.
# Production: tạo qua `kubectl create secret`/SealedSecret/Vault, không commit giá trị thật.
apiVersion: v1
kind: Secret
metadata:
  name: app-tu-phuc-vu-secret
type: Opaque
stringData:
  DATABASE_URL: postgresql://postgres:postgres@app-tu-phuc-vu-db:5432/nestjs_project
  JWT_SECRET: demo-jwt-secret-change-me
  BETTER_AUTH_SECRET: demo-better-auth-secret-32chars-min-ok
  PII_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  ZALO_APP_SECRET: demo-disabled
  ZALO_OA_APP_SECRET: demo-disabled
  ZALO_OA_REFRESH_TOKEN: demo-disabled
