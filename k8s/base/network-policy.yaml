# NetworkPolicy cho app — theo convention cluster (tham khảo neighbor water-network-bff-*).
#
# ⚠️ QUAN TRỌNG: podSelector phải SCOPE theo app (app: nestjs-app), KHÔNG được dùng `{}`
# — vì `podSelector: {}` chọn MỌI pod trong namespace và chặn traffic của tất cả chúng,
# "brick" cả namespace dùng chung (platform-core). Đây là bug đã được sửa (2026-07-17).
#
# Nhãn pod infra đã verify thực tế trong cluster platform-core:
#   apisix=app:apisix | postgres=app:postgres | redis=app:redis
# Namespace kube-system / observability mang nhãn `kubernetes.io/metadata.name`.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nestjs-app-default-deny
spec:
  podSelector:
    matchLabels:
      app: nestjs-app
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nestjs-app-allow
spec:
  podSelector:
    matchLabels:
      app: nestjs-app
  policyTypes:
    - Ingress
    - Egress
  # Ingress: BFF đứng sau APISIX gateway (convention cluster, port service = 3000).
  # Nếu expose trực tiếp qua nginx ingress, thêm một from-rule cho ingress-nginx controller.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: apisix
      ports:
        - protocol: TCP
          port: 3000
  # Egress: DNS + DB + Redis + observability (OTLP) + external HTTPS
  egress:
    # DNS (kube-dns in kube-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Postgres (DB_HOST=postgres)
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - { protocol: TCP, port: 5432 }
    # Redis (REDIS_HOST=redis)
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - { protocol: TCP, port: 6379 }
    # Observability — OTLP/gRPC traces
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - { protocol: TCP, port: 4317 }
    # External HTTPS (OAuth, external APIs...) — giống neighbor water-network-bff
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { protocol: TCP, port: 443 }
