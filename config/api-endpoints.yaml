# API Endpoint Configuration
# Per-service mock/live switching, timeouts, cache tiers, and circuit breaker settings.
# Hot-reloaded via chokidar when MOCK_MODE is not active.

services:
  # =============================================================================
  # MVP Services (Epic 1-3) — Detailed Configuration
  # =============================================================================

  # --- Auth & Identity (Epic 1) ---
  auth:
    adapter: mock
    baseUrl: ${BACKEND_BASE_URL}/auth
    timeout: 3000
    cacheTier: static
    cacheTtl: 43200
    circuitBreaker:
      errorThreshold: 50
      resetTimeout: 10000
      minRequests: 5
    queuePolicy: never
    description: "Authentication & token management"
    methods: ["login", "register", "refresh", "logout", "verify"]

  customer-profile:
    adapter: mock
    baseUrl: ${BACKEND_BASE_URL}/customers
    timeout: 3000
    cacheTier: static
    cacheTtl: 43200
    circuitBreaker:
      errorThreshold: 50
      resetTimeout: 10000
      minRequests: 5
    description: "Customer 360° profile data (flip `adapter: live` when customer-service is ready — see docs/customer-service-contract.md)"
    methods: ["get-profile", "find-by-phone", "create-customer", "get-timeline", "get-related-accounts", "update-profile"]

  contract:
    adapter: mock
    baseUrl: ${BACKEND_BASE_URL}/contracts
    timeout: 3000
    cacheTier: static
    cacheTtl: 43200
    circuitBreaker:
      errorThreshold: 50
      resetTimeout: 10000
      minRequests: 5
    description: "Contract lookup & management"
    methods: ["get-list", "get-detail", "get-by-customer"]

  meter:
    adapter: mock
    baseUrl: ${BACKEND_BASE_URL}/meters
    timeout: 3000
    cacheTier: static
    cacheTtl: 43200
    circuitBreaker:
      errorThreshold: 50
      resetTimeout: 10000
      minRequests: 5
    description: "Meter information & history"
    methods: ["get-info", "get-history", "get-by-contract"]

  meter-reading:
    adapter: mock
    baseUrl: ${BACKEND_BASE_URL}/meter-readings
    timeout: 3000
    cacheTier: dynamic
    cacheTtl: 900
    circuitBreaker:
      errorThreshold: 50
      resetTimeout: 10000
      minRequests: 5
    description: "Meter reading submissions & history"
    methods: ["submit", "get-history", "get-latest"]

  # --- Consumption & Billing (Epic 3) ---
  tariff:
    adapter: mock
    baseUrl: ${BACKEND_BASE_URL}/tariffs
    timeout: 3000
    cacheTier: static
    cacheTtl: 43200
    circuitBreaker:
      errorThreshold: 50
      resetTimeout: 10000
      minRequests: 5
    description: "Tariff & pricing display"
    methods: ["get-by-contract", "calculate", "get-plans"]

  invoice:
    adapter: mock
    baseUrl: ${BACKEND_BASE_URL}/invoices
    timeout: 3000
    cacheTier: dynamic
    cacheTtl: 900
    circuitBreaker:
      errorThreshold: 50
      resetTimeout: 10000
      minRequests: 5
    description: "Invoice list, detail & download"
    methods: ["get-list", "get-detail", "download"]

  # --- Payments (Epic 4) ---
  payment:
    adapter: mock
    baseUrl: ${BACKEND_BASE_URL}/payments
    timeout: 5000
    cacheTier: transaction
    circuitBreaker:
      errorThreshold: 30
      resetTimeout: 30000
      minRequests: 3
    queuePolicy: always
    description: "Payment initiation & QR generation"
    methods: ["initiate", "confirm", "get-status", "generate-qr"]

  payment-webhook:
    adapter: mock
    baseUrl: ${BACKEND_BASE_URL}/payment-webhooks
    timeout: 3000
    cacheTier: transaction
    circuitBreaker:
      errorThreshold: 30
      resetTimeout: 30000
      minRequests: 3
    description: "Payment webhook confirmation"
    methods: ["confirm", "retry"]

  payment-history:
    adapter: mock
    baseUrl: ${BACKEND_BASE_URL}/payment-history
    timeout: 3000
    cacheTier: dynamic
    cacheTtl: 900
    circuitBreaker:
      errorThreshold: 50
      resetTimeout: 10000
      minRequests: 5
    description: "Payment history & multi-invoice payment"
    methods: ["get-list", "get-detail", "pay-multi"]

  auto-debit:
    adapter: mock
    baseUrl: ${BACKEND_BASE_URL}/auto-debit
    timeout: 3000
    cacheTier: static
    cacheTtl: 43200
    circuitBreaker:
      errorThreshold: 50
      resetTimeout: 10000
      minRequests: 5
    description: "Auto-debit registration & management"
    methods: ["register", "cancel", "get-status", "update"]

  debt:
    adapter: mock
    baseUrl: ${BACKEND_BASE_URL}/debts
    timeout: 3000
    cacheTier: dynamic
    cacheTtl: 900
    circuitBreaker:
      errorThreshold: 50
      resetTimeout: 10000
      minRequests: 5
    description: "Debt overview & history"
    methods: ["get-overview", "get-history", "get-detail"]

  # --- Issue Reporting (Epic 5) ---
